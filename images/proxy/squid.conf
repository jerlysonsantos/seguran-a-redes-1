# Proxy da LAN: gateway dos PCs (10.0.4.0/24)
#  - 3128: modo explicito (curl -x http://10.0.4.1:3128)
#  - 3129: modo transparente, recebe o HTTP desviado pelo iptables do proxy
http_port 3128
http_port 3129 intercept

acl lab src 10.0.0.0/8

# DNS: o padrao do Squid (resolv.conf do proxy, preenchido no proxy.startup com o DNS do host)

acl SSL_ports port 443
acl Safe_ports port 80 443 1025-65535
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow lab
http_access deny all

# Cache: memoria + disco
cache_mem 64 MB
maximum_object_size_in_memory 1 MB
cache_dir ufs /var/spool/squid 1024 16 256
maximum_object_size 50 MB

# Tempo de validade dos objetos sem cabecalho de cache (padrao do Squid)
refresh_pattern ^ftp:             1440  20%  10080
refresh_pattern -i (/cgi-bin/|\?) 0     0%   0
refresh_pattern .                 0     20%  4320

access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
coredump_dir /var/spool/squid
