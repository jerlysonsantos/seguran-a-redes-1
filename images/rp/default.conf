# Proxy reverso: recebe as requisicoes da LAN e da Internet e encaminha para o web
# proxy.conf e ssl.conf sao os arquivos padrao do SWAG (cabecalhos de proxy e TLS)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        include /config/nginx/proxy.conf;
        proxy_pass http://10.0.2.20;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    include /config/nginx/ssl.conf;

    location / {
        include /config/nginx/proxy.conf;
        proxy_pass http://10.0.2.20;
    }
}
